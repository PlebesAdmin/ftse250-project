name: Daily FTSE 250 Data Update

on:
  schedule:
    - cron: '0 18 * * 1-5'   # Monday–Friday 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt openpyxl

      - name: Download latest data and update database
        run: python download_data.py

      - name: Create weekly summary
        run: python create_summary.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -f ftse250_data.db
          git add ftse250_weekly_summary_*.xlsx || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update FTSE 250 data + weekly summary $(date -u +%Y-%m-%d)"
            git push
          fi
