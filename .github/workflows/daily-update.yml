name: Daily FTSE 250 Data Update

on:
  schedule:
    # Runs Monday–Friday at 18:00 UTC (after London market close)
    - cron: '0 18 * * 1-5'
  workflow_dispatch:   # Lets you run it manually any time

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download latest data and update database
        run: python download_data.py

      - name: Commit and push updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ftse250_data.db
          git diff --staged --quiet || git commit -m "Auto-update FTSE 250 data $(date -u +%Y-%m-%d)"
          git push
