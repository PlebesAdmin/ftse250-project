<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FTSE 250 Weekly Summary</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --header: #0f172a;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --up: #16a34a;
      --down: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 16px;
      color: var(--text);
      line-height: 1.4;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    header {
      background: var(--header);
      color: white;
      padding: 20px 24px;
    }
    header h1 {
      margin: 0 0 4px 0;
      font-size: 1.45rem;
      font-weight: 700;
    }
    header p {
      margin: 0;
      opacity: 0.85;
      font-size: 0.9rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px 20px 8px;
      align-items: center;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }
    .search-box {
      flex: 1;
      min-width: 180px;
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    .search-box:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .meta {
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .table-wrapper {
      overflow-x: auto;
      padding: 0 0 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
      min-width: 640px;
    }
    th {
      text-align: left;
      padding: 13px 14px;
      background: #f1f5f9;
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 0;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th:hover { background: #e2e8f0; }
    th .arrow { font-size: 0.75rem; opacity: 0.5; margin-left: 4px; }
    td {
      padding: 11px 14px;
      border-bottom: 1px solid #f1f5f9;
    }
    tr:hover { background: #f8fafc; }
    .up { color: var(--up); font-weight: 600; }
    .down { color: var(--down); font-weight: 600; }
    .neutral { color: var(--muted); }
    .loading, .error {
      text-align: center;
      padding: 50px 20px;
      color: var(--muted);
    }
    footer {
      text-align: center;
      padding: 14px;
      font-size: 0.8rem;
      color: var(--muted);
      background: #f8fafc;
      border-top: 1px solid var(--border);
    }
    @media (max-width: 600px) {
      body { padding: 8px; }
      header { padding: 16px; }
      header h1 { font-size: 1.25rem; }
      .toolbar { padding: 12px 14px; }
      td, th { padding: 10px 10px; font-size: 0.88rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>FTSE 250 Weekly Summary</h1>
      <p>Latest close + 1-week % change • Updated automatically</p>
    </header>

    <div class="toolbar">
      <input type="text" class="search-box" id="search" placeholder="Search ticker…" autocomplete="off">
      <div class="meta" id="last-updated">Loading…</div>
    </div>

    <div id="content" class="loading">Loading data…</div>

    <footer>
      Free zero-cost pipeline • Data from Yahoo Finance via GitHub Actions
    </footer>
  </div>

  <script>
    let allData = [];
    let sortKey = "pct_change_1w";
    let sortAsc = false;

    async function loadData() {
      try {
        const response = await fetch("summary.json?t=" + Date.now());
        allData = await response.json();

        if (!allData || allData.length === 0) {
          document.getElementById("content").innerHTML = '<p class="loading">No data available yet.</p>';
          return;
        }

        // Show last updated from the newest date in the data
        const latestDate = allData.reduce((max, r) => r.latest_date > max ? r.latest_date : max, "");
        document.getElementById("last-updated").textContent = 
          "Data as of " + latestDate.slice(0, 10) + " • " + allData.length + " tickers";

        renderTable();
      } catch (err) {
        document.getElementById("content").innerHTML = 
          '<p class="error">Could not load data. Try refreshing in a minute.</p>';
        console.error(err);
      }
    }

    function renderTable() {
      const search = document.getElementById("search").value.toLowerCase().trim();
      let filtered = allData.filter(r => 
        (r.ticker || "").toLowerCase().includes(search) || 
        (r.name || "").toLowerCase().includes(search)
      );

      // Sort
      filtered.sort((a, b) => {
        let va = a[sortKey];
        let vb = b[sortKey];
        if (typeof va === "string") {
          return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
        }
        return sortAsc ? (va - vb) : (vb - va);
      });

      let html = `
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th data-key="ticker">Ticker <span class="arrow"></span></th>
                <th data-key="name">Company <span class="arrow"></span></th>
                <th data-key="pct_change_1w">1-Week % <span class="arrow"></span></th>
                <th data-key="latest_close">Latest Close <span class="arrow"></span></th>
                <th data-key="week_ago_close">Week Ago <span class="arrow"></span></th>
                <th data-key="latest_date">Latest Date <span class="arrow"></span></th>
                <th data-key="volume">Volume <span class="arrow"></span></th>
              </tr>
            </thead>
            <tbody>
      `;

      filtered.forEach(row => {
        const pct = row.pct_change_1w;
        let pctClass = "neutral";
        if (pct > 0) pctClass = "up";
        if (pct < 0) pctClass = "down";

        const volume = row.volume != null ? Number(row.volume).toLocaleString() : "—";
        const name = row.name || row.ticker || "";
        const date = (row.latest_date || "").toString().slice(0, 10);

        html += `
          <tr>
            <td><strong>${row.ticker}</strong></td>
            <td>${name}</td>
            <td class="${pctClass}">${pct > 0 ? "+" : ""}${pct}%</td>
            <td>${row.latest_close}</td>
            <td>${row.week_ago_close}</td>
            <td>${date}</td>
            <td>${volume}</td>
          </tr>
        `;
      });

      html += `</tbody></table></div>`;
      document.getElementById("content").innerHTML = html;

      // Click-to-sort handlers
      document.querySelectorAll("th[data-key]").forEach(th => {
        th.addEventListener("click", () => {
          const key = th.dataset.key;
          if (sortKey === key) {
            sortAsc = !sortAsc;
          } else {
            sortKey = key;
            sortAsc = (key === "ticker" || key === "name" || key === "latest_date");
          }
          renderTable();
        });
      });
    }

    document.getElementById("search").addEventListener("input", renderTable);
    loadData();
  </script>
</body>
</html>
